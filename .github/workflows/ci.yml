name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64

    runs-on: \${{ matrix.os }}

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure GitHub Actions Runtime (for vcpkg GHA cache)
        if: runner.os == 'Windows'
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Set up vcpkg backend env
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VCPKG_BINARY_SOURCES=clear;gha,readwrite" | Out-File -FilePath \$env:GITHUB_ENV -Append

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install --triplet x64-windows

      - name: Configure Homebrew cache
        if: runner.os == 'macOS'
        run: |
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> "\$GITHUB_ENV"
          echo "HOMEBREW_CACHE=\((brew --cache)" >> "\)GITHUB_ENV"

      - name: Restore Homebrew cache
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: \${{ env.HOMEBREW_CACHE }}
          key: homebrew-\({{ matrix.platform }}-\){{ hashFiles('.github/workflows/release.yml', '.github/workflows/ci.yml') }}
          restore-keys: |
            homebrew-\${{ matrix.platform }}-

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja boost openssl@3 pugixml spdlog googletest

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON `
            -DCMAKE_TOOLCHAIN_FILE="\$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="\((brew --prefix);\)(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure