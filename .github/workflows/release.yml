
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up vcpkg cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path "${{ github.workspace }}/vcpkg-cache" | Out-Null

          "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg-cache,readwrite" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-windows-x64-

      - name: Install dependencies
        shell: pwsh
        run: |
          vcpkg install --triplet x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/veil | Out-Null

          Copy-Item build/veil.exe dist/veil/
          Copy-Item .env.example dist/veil/
          Copy-Item README.md dist/veil/
          Copy-Item LICENSE dist/veil/

          $dlls = Get-ChildItem build -Filter "*.dll" -Recurse

          foreach ($dll in $dlls) {
            Copy-Item $dll.FullName dist/veil/ -Force
          }

          $runtime = "vcpkg_installed/x64-windows/bin"

          if (Test-Path $runtime) {
            Copy-Item "$runtime/*.dll" dist/veil/ -ErrorAction SilentlyContinue
          }

          Compress-Archive `
            -Path dist/veil/* `
            -DestinationPath "veil-${{ github.ref_name }}-windows-x64.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "veil-${{ github.ref_name }}-windows-x64.zip" `
            --title "Veil ${{ github.ref_name }}" `
            --generate-notes `
            --prerelease
