name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            artifact: veil-windows-x64
          - os: macos-15
            platform: macos-arm64
            artifact: veil-macos-arm64
          - os: macos-15-intel
            platform: macos-x64
            artifact: veil-macos-x64

    runs-on: ${{ matrix.os }}

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up vcpkg cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path "${{ github.workspace }}/vcpkg-cache" | Out-Null

          "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg-cache,readwrite" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore vcpkg cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-windows-x64-

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install --triplet x64-windows

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja boost openssl@3 pugixml spdlog googletest

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/veil | Out-Null

          Copy-Item build/veil.exe dist/veil/
          Copy-Item .env.example dist/veil/
          Copy-Item README.md dist/veil/
          Copy-Item LICENSE dist/veil/

          Get-ChildItem build -Filter "*.dll" -File |
            Copy-Item -Destination dist/veil/ -Force

          $runtime = "vcpkg_installed/x64-windows/bin"

          if (Test-Path $runtime) {
            Get-ChildItem $runtime -Filter "*.dll" -File |
              Copy-Item -Destination dist/veil/ -Force
          }

          Compress-Archive `
            -Path dist/veil/* `
            -DestinationPath "veil-${{ github.ref_name }}-${{ matrix.platform }}.zip"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/veil

          cp build/veil dist/veil/
          cp .env.example dist/veil/
          cp README.md dist/veil/
          cp LICENSE dist/veil/

          cd dist
          zip -r "../veil-${{ github.ref_name }}-${{ matrix.platform }}.zip" veil

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: veil-${{ github.ref_name }}-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: veil-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.zip \
            --title "Veil ${{ github.ref_name }}" \
            --generate-notes \
            --prerelease